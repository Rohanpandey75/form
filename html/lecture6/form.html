<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Form</h1>
    <div>
        <form action="welcomeyouWon.html" target="_blank">
            <fieldset>
                <legend>Enter all the information</legend>


                <label for="full Name">full Name :</label>
                <input type="text" id="full Name" placeholder="Enter your name" required>
                <br><br>

                <label for="Email">Email :</label>
                <input type="email" id="Email" placeholder="Enter your email" required>
                <br><br>

                <label for="Password">Password :</label>
                <input type="password" id="Password" placeholder="Enter your password" required>
                <br><br>

                <label for="checkbox">Are you 18+ :</label>
                <input type="checkbox" id="checkbox" required>
                <br><br>

                <label for="phoneNumber">Enter your number :</label>
                <input type="number" id="phoneNumber" required minlength="10" min="0" maxlength="10">
                <br><br>

                <label for="gender">Gender :</label>
                <label for="gender">Male :</label>
                <input type="radio" id="gender" name="gender" required>
                <label for="gender">Female :</label>
                <input type="radio" id="gender" name="gender" required>
                <br><br>

                <label for="date">Enter your DOB :</label>
                <input type="date" id="date" required>
                <br><br>

                <label for="file">Upload photo :</label>
                <input type="file" id="file" required>
                <br><br>
                <label for="city"> Select your city</label>
                <select name="city" id="city">
                    <option value="delhi">Delhi</option>
                    <option value="gorakhpur">Gorakhpur</option>
                    <option value="banaras" selected>banaras</option>
                    <option value="semara">semara</option>
                    <option value="auratar">auratar</option>
                </select>





                <button type="submit"> Submit form</button>
            </fieldset>
        </form>
    </div>

</body>

</html>
